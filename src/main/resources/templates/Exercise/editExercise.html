<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать упражнение</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ВСЁ УВЕЛИЧЕНО В 2 РАЗА ОТ НОРМЫ */
        body {
            font-size: 32px; /* 16px × 2 = 32px */
            line-height: 1.5;
            margin: 0;
            padding: 40px 0; /* 20px × 2 */
            background: #fafafa;
        }

        .container {
            max-width: 1800px; /* 900px × 2 */
            margin: 0 auto;
            padding: 0 40px; /* 20px × 2 */
        }

        .btn {
            background: firebrick;
            color: white;
            padding: 16px 32px; /* 8×16 ×2 */
            border: none;
            border-radius: 12px; /* 6px ×2 */
            font-size: 1.75rem; /* 14px ×2 */
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
        }

        .btn:hover {
            background: #b22222;
            transform: translateY(-2px); /* 1px ×2 */
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #545b62;
        }

        .btn-save {
            background: #155724;
            font-family: 'Montserrat', sans-serif;
            padding: 20px 48px; /* 10×24 ×2 */
        }

        .btn-save:hover {
            background: #0f4019;
        }

        .btn-small {
            padding: 12px 24px; /* 6×12 ×2 */
            font-size: 1.5rem; /* 12px ×2 */
        }

        .divider {
            border: none;
            height: 4px; /* 2px ×2 */
            background: linear-gradient(90deg, transparent, firebrick, transparent);
            margin: 40px auto; /* 20px ×2 */
            max-width: 1000px; /* 500px ×2 */
        }

        .form-container {
            max-width: 1000px; /* 500px ×2 */
            margin: 0 auto;
            font-family: 'Roboto', sans-serif;
        }

        .form-group {
            margin-bottom: 30px; /* 15px ×2 */
        }

        label {
            display: block;
            margin-bottom: 10px; /* 5px ×2 */
            font-weight: 500;
            color: #333;
            font-size: 1.75rem; /* 14px ×2 */
        }

        select, input, textarea {
            padding: 16px 24px; /* 8×12 ×2 */
            border: 2px solid #e0e0e0; /* 1px ×2 */
            border-radius: 8px; /* 4px ×2 */
            font-family: 'Roboto', sans-serif;
            font-size: 1.75rem; /* 14px ×2 */
            transition: border-color 0.2s;
            background: #fafafa;
        }

        select {
            width: 500px; /* 250px ×2 */
        }

        textarea {
            width: 100%;
            resize: vertical;
            min-height: 120px; /* 60px ×2 */
            max-width: 1000px; /* 500px ×2 */
            box-sizing: border-box;
        }

        input[type="text"] {
            width: 100%;
            max-width: 1000px; /* 500px ×2 */
            box-sizing: border-box;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: firebrick;
            background: white;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 40px 0; /* 20px ×2 */
        }

        h3 {
            font-family: 'Montserrat', sans-serif;
            color: #333;
            text-align: center;
            margin-bottom: 40px; /* 20px ×2 */
            font-size: 2.25rem; /* 18px ×2 */
        }

        .error-message {
            color: #dc3545;
            font-size: 1.5rem; /* 12px ×2 */
            margin-top: 6px; /* 3px ×2 */
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 style="color: firebrick; font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 4px; text-align: center; font-size: 2.5rem; margin-bottom: 20px;">GymBro</h2>
    <hr class="divider"/>

    <div class="form-container">
        <h3>Редактировать упражнение</h3>

        <form th:action="@{/exercise/{id}/edit(id=${exercise.id})}" method="post" th:object="${exercise}">
            <input type="hidden" name="_method" value="patch">

            <div class="form-group">
                <label>Название упражнения:</label>
                <input type="text" th:field="*{name}" required>
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label>Описание:</label>
                <textarea th:field="*{description}" placeholder="Описание упражнения"></textarea>
                <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label>Группа мышц:</label>
                <select th:field="*{muscleGroup}" required>
                    <option value="">-- Выберите группу --</option>
                    <option th:each="group : ${T(GymBro.Model.MuscleGroup).values()}"
                            th:value="${group}"
                            th:selected="${exercise.muscleGroup == group}"
                            th:text="${group.russianName}"></option>
                </select>
                <div th:if="${#fields.hasErrors('muscleGroup')}" th:errors="*{muscleGroup}" class="error-message"></div>
            </div>

            <div class="form-actions">
                <a th:href="@{/exercise}"><button type="button" class="btn">Отмена</button></a>
                <button type="submit" class="btn btn-save">Сохранить изменения</button>
            </div>
        </form>
    </div>

    <hr class="divider"/>
</div>
</body>
</html>
