<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-size: 32px;
            line-height: 1.5;
            margin: 0;
            padding: 40px 0;
            background: #fafafa;
            font-family: 'Roboto', sans-serif;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
            font-family: 'Roboto', sans-serif;
        }

        .btn {
            background: firebrick;
            color: white;
            padding: 20px 40px;
            border: none;
            border-radius: 12px;
            font-size: 1.75rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            width: 70%;
            display: block;
            margin: 0 auto;
        }

        .btn:hover {
            background: #b22222;
            transform: translateY(-2px);
        }

        .divider {
            border: none;
            height: 4px;
            background: linear-gradient(90deg, transparent, firebrick, transparent);
            margin: 40px auto;
            max-width: 1000px;
        }

        h2 {
            color: firebrick;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 40px;
            text-align: center;
        }

        input[type="text"], input[type="password"] {
            width: 70%;
            padding: 20px 24px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Roboto', sans-serif;
            font-size: 1.75rem;
            transition: border-color 0.2s;
            background: #fafafa;
            box-sizing: border-box;
        }

        input[type="text"]::placeholder, input[type="password"]::placeholder {
            color: #666;
            font-size: 1.75rem;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: firebrick;
            background: white;
        }

        .error-message {
            color: #dc3545;
            font-size: 1.75rem;
            margin: 30px 0;
            font-weight: 500;
            text-align: center;
            padding: 20px;
            border: 2px solid #dc3545;
            border-radius: 8px;
            background: #f8d7da;
        }

        .register-link {
            text-align: center;
            margin-top: 40px;
            font-size: 1.75rem;
        }

        .register-link a {
            color: firebrick;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>GymBro</h2>
    <hr class="divider"/>

    <div class="form-container">
        <form th:action="@{/auth/login}" method="post">
            <div class="form-group">
                <input type="text" name="username" placeholder="Email" required>
            </div>

            <div class="form-group">
                <input type="password" name="password" placeholder="Пароль" required>
            </div>

            <button type="submit" class="btn">Войти</button>
        </form>

        <div th:if="${param.error}" class="error-message">
            Неверный логин или пароль
        </div>

        <div class="register-link">
            <p>Нет аккаунта? <a th:href="@{/auth/register}">Зарегистрироваться</a></p>
        </div>
    </div>

    <hr class="divider"/>
</div>
</body>
</html>
