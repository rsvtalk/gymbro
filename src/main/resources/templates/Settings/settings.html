<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настройки</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-size: 32px;
            line-height: 1.5;
            margin: 0;
            padding: 50px 0;
            background: #fafafa;
            font-family: 'Roboto', sans-serif;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .btn {
            background: firebrick;
            color: white;
            padding: 24px 48px;
            border: none;
            border-radius: 16px;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Montserrat', sans-serif;
        }

        .btn:hover {
            background: #b22222;
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .divider {
            border: none;
            height: 4px;
            background: linear-gradient(90deg, transparent, firebrick, transparent);
            margin: 40px auto;
            max-width: 1000px;
        }

        .gymbro-header {
            color: firebrick;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .settings-form {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 40px;
        }

        .form-label {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 20px;
            font-size: 1.8rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Roboto', sans-serif;
            transition: border-color 0.3s;
            background: #fafafa;
            box-sizing: border-box;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: firebrick;
            background: white;
        }

        .btn-save {
            background: #155724;
            font-family: 'Montserrat', sans-serif;
            padding: 20px 48px;
        }

        .btn-save:hover {
            background: #0f4019;
        }

        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            color: #333;
            text-align: center;
            margin: 60px 0 40px 0;
        }

        .subsection-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            color: #666;
            margin: 40px 0 20px 0;
            font-style: italic;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section-divider {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e0e0e0, transparent);
            margin: 40px 0;
        }
    </style>
</head>
<body>
<div class="container">

    <h2 class="gymbro-header">GymBro</h2>
    <hr class="divider"/>

    <h3 class="section-title">Настройки профиля</h3>

    <form th:action="@{/settings/edit}" th:object="${person}" method="post" class="settings-form">
        <input type="hidden" name="_method" value="patch" />

        <h4 class="subsection-title">Личные данные</h4>

        <div class="form-group">
            <label class="form-label">Имя</label>
            <input type="text"
                   th:field="*{name}"
                   class="form-input"
                   placeholder="Введите ваше имя">
        </div>

        <div class="form-group">
            <label class="form-label">Рост (см)</label>
            <input type="number"
                   th:field="*{height}"
                   class="form-input"
                   placeholder="Введите ваш рост"
                   min="100"
                   max="250">
        </div>

        <div class="form-group">
            <label class="form-label">Год рождения</label>
            <input type="number"
                   th:field="*{year}"
                   class="form-input"
                   placeholder="Введите год рождения"
                   min="1900"
                   max="2024">
        </div>

        <hr class="section-divider"/>

        <h4 class="subsection-title">Единицы измерения</h4>

        <div class="form-group">
            <label class="form-label">Единица измерения веса</label>
            <select th:field="*{weightUnit}" class="form-select">
                <option th:each="unit : ${T(GymBro.Model.enums.WeightUnit).values()}"
                        th:value="${unit}"
                        th:text="${unit.fullRussianName}"></option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Единица измерения длины</label>
            <select th:field="*{heightUnit}" class="form-select">
                <option th:each="unit : ${T(GymBro.Model.enums.HeightUnit).values()}"
                        th:value="${unit}"
                        th:text="${unit.fullRussianName}"></option>
            </select>
        </div>

        <div style="text-align: center;">
            <button type="submit" class="btn btn-save">Сохранить изменения</button>
        </div>

    </form>

    <hr class="divider"/>

    <div style="text-align: center; margin-top: 40px;">
        <a th:href="@{/menu}"><button class="btn" type="button">Назад</button></a>
    </div>

</div>
</body>
</html>
