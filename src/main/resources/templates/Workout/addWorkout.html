<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новая тренировка</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-size: 32px;
            line-height: 1.5;
            margin: 0;
            padding: 40px 0;
            background: #fafafa;
            font-family: 'Roboto', sans-serif;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .btn {
            background: firebrick;
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 1.75rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
        }

        .btn:hover {
            background: #b22222;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #545b62;
        }

        .btn-save {
            background: #155724;
            font-family: 'Montserrat', sans-serif;
            padding: 20px 48px;
        }

        .btn-save:hover {
            background: #0f4019;
        }

        .btn-small {
            padding: 12px 24px;
            font-size: 1.5rem;
        }

        .divider {
            border: none;
            height: 4px;
            background: linear-gradient(90deg, transparent, firebrick, transparent);
            margin: 40px auto;
            max-width: 1000px;
        }

        .form-container {
            max-width: 1000px;
            margin: 0 auto;
            font-family: 'Roboto', sans-serif;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #333;
            font-size: 1.75rem;
        }

        select, input, textarea {
            padding: 16px 24px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Roboto', sans-serif;
            font-size: 1.75rem;
            transition: border-color 0.2s;
            background: #fafafa;
        }

        select {
            width: 100%;
            max-width: none;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            resize: vertical;
            min-height: 120px;
            max-width: 1000px;
            box-sizing: border-box;
        }

        input[type="number"] {
            text-align: center;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: firebrick;
            background: white;
        }

        .exercises-table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            font-size: 1.625rem;
            background: #fafafa;
            border-radius: 8px;
            overflow: hidden;
            max-width: 1000px;
            box-sizing: border-box;
        }

        .exercises-table th {
            background: #f0f0f0;
            color: #333;
            padding: 20px 16px;
            font-weight: 500;
            border-bottom: 4px solid #666;
            text-align: center;
        }

        .exercises-table th:first-child {
            text-align: left;
        }

        .exercises-table td {
            padding: 16px;
            border-bottom: 2px solid #e0e0e0;
            vertical-align: middle;
        }

        .exercise-row:hover td {
            background: #f5f5f5;
        }

        .exercise-select {
            width: 100%;
        }

        .number-input {
            width: 100px;
        }

        .weight-input {
            width: 120px;
        }

        .remove-btn {
            background: #8B0000;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .remove-btn:hover {
            background: #600000;
        }

        .add-exercise-btn {
            margin: 20px 0 40px 0;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 40px 0;
        }

        h3 {
            font-family: 'Montserrat', sans-serif;
            color: #333;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.25rem;
        }

        .error-message {
            color: #dc3545;
            font-size: 1.5rem;
            margin-top: 6px;
            font-weight: 500;
        }

        .hidden-remove {
            visibility: hidden;
        }

        .notes-section {
            margin-bottom: 40px;
        }

        .unit-switch {
            display: flex;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            width: 112px;
            margin-left: 10px;
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            position: relative;
        }

        .unit-option {
            flex: 1;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            font-size: 1.25rem;
            font-weight: 600;
            transition: all 0.3s ease;
            background: transparent;
            color: #ccc;
            z-index: 1;
            position: relative;
        }

        .unit-option.active {
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 100, 100, 0.8);
        }

        .unit-switch::before {
            content: '';
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: 52px;
            background: linear-gradient(145deg, firebrick, #ff4444);
            border-radius: 8px;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 0 30px rgba(178, 34, 34, 0.6);
        }

        .unit-switch.lbs-active::before {
            left: calc(100% - 56px);
        }

        .weight-controls {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reps-controls {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .exercises-table th:nth-child(1) { width: 45%; }
        .exercises-table th:nth-child(2) { width: 15%; }
        .exercises-table th:nth-child(3) { width: 15%; }
        .exercises-table th:nth-child(4) { width: 15%; }
        .exercises-table th:nth-child(5) { width: 10%; }

        .gymbro-header {
            color: firebrick;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">

    <h2 class="gymbro-header">GymBro</h2>
    <hr class="divider"/>

    <div class="form-container">
        <h3>Новая тренировка</h3>

        <div th:if="${#ctx.containsVariable('org.springframework.validation.BindingResult.workout')}" class="error-message">
            <div th:each="error : ${#ctx.getVariable('org.springframework.validation.BindingResult.workout').globalErrors}">
                <span th:text="${error.defaultMessage}">Ошибка</span>
            </div>
        </div>

        <form th:action="@{/workout/add}" method="post" th:object="${workout}">

            <div class="form-group">
                <label>Группа мышц</label>
                <select th:field="*{muscleGroup}" required>
                    <option value="">-- Выберите группу --</option>
                    <option th:each="group : ${T(GymBro.Model.enums.MuscleGroup).values()}"
                            th:value="${group}"
                            th:text="${group.russianDayName}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Упражнения</label>
                <table class="exercises-table">
                    <thead>
                    <tr>
                        <th>Упражнение</th>
                        <th>Вес</th>
                        <th>Повторы</th>
                        <th>Ед. изм.</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="exercises-tbody">
                    <tr class="exercise-row">
                        <td>
                            <select name="exerciseIds" class="exercise-select" required>
                                <option value="">Выберите упражнение</option>
                                <optgroup label="Мои">
                                    <option th:each="ex : ${customExercises}"
                                            th:value="${ex.id}"
                                            th:text="${ex.name}"></option>
                                </optgroup>
                                <optgroup label="Базовые">
                                    <option th:each="ex : ${systemExercises}"
                                            th:value="${ex.id}"
                                            th:text="${ex.name}"></option>
                                </optgroup>
                            </select>
                        </td>
                        <td>
                            <div class="weight-controls">
                                <input type="number" name="weights" step="0.1" min="0" class="number-input weight-input" required>
                            </div>
                        </td>
                        <td>
                            <div class="reps-controls">
                                <input type="number" name="reps" min="1" class="number-input" required>
                            </div>
                        </td>
                        <td>
                            <div class="unit-switch">
                                <div class="unit-option active" data-unit="kg">кг</div>
                                <div class="unit-option" data-unit="lbs">lbs</div>
                            </div>
                            <input type="hidden" name="isLbs" value="false">
                        </td>
                        <td>
                            <button type="button" class="remove-btn hidden-remove">×</button>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div class="add-exercise-btn">
                    <button type="button" class="btn btn-secondary btn-small" onclick="addExerciseRow()">+ Добавить упражнение</button>
                </div>
            </div>

            <div class="form-group notes-section">
                <label>Заметки</label>
                <textarea th:field="*{notes}" maxlength="200" placeholder="Необязательно"></textarea>
            </div>

            <div class="form-actions">
                <a th:href="@{/workout}"><button type="button" class="btn">Отмена</button></a>
                <button type="submit" class="btn btn-save">Сохранить</button>
            </div>

        </form>
    </div>

    <hr class="divider"/>

</div>

<script>
    function addExerciseRow() {
        const tbody = document.getElementById('exercises-tbody');
        const firstRow = tbody.querySelector('.exercise-row');

        const newRow = firstRow.cloneNode(true);

        newRow.querySelector('select').selectedIndex = 0;
        newRow.querySelector('input[name="weights"]').value = '';
        newRow.querySelector('input[name="reps"]').value = '';

        const unitSwitch = newRow.querySelector('.unit-switch');
        const kgOption = unitSwitch.querySelector('.unit-option[data-unit="kg"]');
        const lbsOption = unitSwitch.querySelector('.unit-option[data-unit="lbs"]');
        const hiddenInput = newRow.querySelector('input[name="isLbs"]');

        kgOption.classList.add('active');
        lbsOption.classList.remove('active');
        hiddenInput.value = 'false';
        unitSwitch.classList.remove('lbs-active');

        addUnitSwitchListeners(unitSwitch);

        const removeBtn = newRow.querySelector('.remove-btn');
        removeBtn.classList.remove('hidden-remove');

        removeBtn.onclick = function() {
            newRow.remove();
        };

        tbody.appendChild(newRow);
    }

    function addUnitSwitchListeners(switchElement) {
        const options = switchElement.querySelectorAll('.unit-option');
        const hiddenInput = switchElement.parentNode.querySelector('input[name="isLbs"]');

        options.forEach(option => {
            option.addEventListener('click', function() {
                options.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                hiddenInput.value = (this.dataset.unit === 'lbs').toString();

                if (this.dataset.unit === 'kg') {
                    switchElement.classList.remove('lbs-active');
                } else {
                    switchElement.classList.add('lbs-active');
                }
            });
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        const unitSwitches = document.querySelectorAll('.unit-switch');
        unitSwitches.forEach(switchElement => {
            addUnitSwitchListeners(switchElement);
        });
    });
</script>

</body>
</html>
